<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MONA · Partners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--lime:#c8ff3d;--sans:"Manrope",ui-sans-serif,system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:#000;color:#f5f6f7;font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:var(--lime);color:#08090a}
h1{margin:0;font-weight:800;letter-spacing:-.025em;line-height:1.05}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--lime);color:#08090a;font:700 16px var(--sans);cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 0 1px rgba(200,255,61,.3),0 10px 40px -10px rgba(200,255,61,.6)}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.glass{background:rgba(128,128,128,.2);-webkit-backdrop-filter:blur(28px) saturate(140%);backdrop-filter:blur(28px) saturate(140%)}
#gate{position:fixed;inset:0;display:grid;place-items:center;padding:20px;overflow:auto}
#gate .bg{position:fixed;inset:0;background:url(/partners/hero-trail.webp) 62% 40%/cover;transform:scale(1.06);animation:drift 9s var(--ease) forwards}
@media (min-width:1000px){#gate .bg{background-image:url(/partners/hero-trail-wide.webp);background-position:right 40%}}
#gate .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.35) 45%,rgba(0,0,0,.8))}
@keyframes drift{to{transform:scale(1)}}
.login{position:relative;width:min(420px,100%);padding:32px 28px 26px;border-radius:30px;border:1px solid rgba(255,255,255,.14);box-shadow:0 40px 120px -30px #000}
.login .logo{display:block;width:150px;height:38px;margin-bottom:22px}
.login h1{font-size:30px}
.login p{margin:10px 0 22px;color:rgba(255,255,255,.75);font-size:15px}
.field{position:relative}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;color:rgba(255,255,255,.8)}
.field input{width:100%;height:52px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);color:#fff;font:600 16px var(--sans);letter-spacing:.06em;padding:0 70px 0 16px}
.field input:focus{outline:none;border-color:var(--lime);box-shadow:0 0 0 3px rgba(200,255,61,.2)}
.field .show{position:absolute;right:6px;bottom:6px;height:40px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:rgba(255,255,255,.7);font:600 13px var(--sans);cursor:pointer}
.login .btn{width:100%;margin-top:14px}
.err{min-height:22px;margin-top:10px;font-size:14px;color:#ff8a7d}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fine{margin:14px 0 0!important;font-size:12.5px!important;color:rgba(255,255,255,.55)!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="gate">
 <div class="bg" role="img" aria-label="A trail runner on a misty mountain ridge"></div>
 <form class="login glass{{SHAKE}}" method="post" action="/partners">
  <svg class="logo" viewBox="0 0 400 100" role="img" aria-label="MONA Fitness"><!--LOGO--></svg>
  <h1>Partners &amp; investors</h1>
  <p>This is a private preview of MONA. Enter the access code you received from Rod.</p>
  <input type="hidden" name="action" value="signin">
  <div class="field">
   <label for="code">Access code</label>
   <input id="code" name="code" type="password" autocomplete="current-password" autocapitalize="characters" spellcheck="false" required autofocus{{INVALID}}>
   <button type="button" class="show" id="showBtn" aria-controls="code">Show</button>
  </div>
  <button class="btn" type="submit">Enter</button>
  <div class="err" id="err" role="alert">{{ERROR}}</div>
  <p class="fine">Don't have a code? Write to hello@mona.fitness</p>
 </form>
</div>
<script>
{const b=document.getElementById("showBtn"),c=document.getElementById("code");
b.addEventListener("click",()=>{const s=c.type==="password";c.type=s?"text":"password";b.textContent=s?"Hide":"Show";c.focus()});}
</script>
</body>
</html>
